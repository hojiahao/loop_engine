name: loop-engine

services:
  development:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    user: "${LOOP_ENGINE_UID:-1000}:${LOOP_ENGINE_GID:-1000}"
    environment:
      LOOP_ENGINE_RUNTIME_ROOT: /var/lib/loop-engine-dev
      COREPACK_HOME: /usr/local/share/corepack
    volumes:
      - .:/workspace
      - development-python:/workspace/.venv
      - development-runtime:/var/lib/loop-engine-dev
    working_dir: /workspace

volumes:
  development-python:
  development-runtime:
