name: loop-engine-workers

# The host launcher is trusted infrastructure, never an Agent tool. Only it can
# choose a broker-accepted, current-lease leaf view. A receipt alone is not a lease.
x-worker: &worker
  image: m.daocloud.io/docker.io/library/python:3.14.4-slim-bookworm@sha256:fc74d22ffd0d5ac395a4b7bdda75a4539758862c49ebf3005647084631e63789
  user: "65532:65532"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 32
  mem_limit: 256m
  cpus: 1
  tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev"]
  working_dir: /tmp
  entrypoint: ["python", "-I", "-B"]
  environment:
    PYTHONDONTWRITEBYTECODE: "1"

services:
  discovery:
    <<: *worker
    profiles: [discovery]
  provider:
    <<: *worker
    profiles: [provider]
  research:
    <<: *worker
    profiles: [research]
    volumes:
      - type: bind
        source: "${LOOP_WORKER_VIEW:?an authorized leaf view is required}"
        target: /data
        read_only: true
        bind:
          create_host_path: false
  holdout:
    <<: *worker
    profiles: [holdout]
    volumes:
      - type: bind
        source: "${LOOP_WORKER_VIEW:?an authorized leaf view is required}"
        target: /data
        read_only: true
        bind:
          create_host_path: false
