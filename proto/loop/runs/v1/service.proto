syntax = "proto3";

package loop.runs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "loop/discovery/v1/service.proto";
import "loop/research/v1/service.proto";
import "loop/v1/common.proto";

// RunService is owned by the authenticated Human operator. The server resolves
// the frozen plan and Agent executor; callers cannot supply child job inputs,
// replacement models, budgets, datasets, or protected research capabilities.
service RunService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // Executes the current child and advances at most one durable round. The
  // original command key never authorizes a second advancement on replay.
  rpc StepRun(StepRunRequest) returns (StepRunResponse);
  // Owner-scoped observation is available without a live execution plan.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_ACTIVE = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_BUDGET_EXHAUSTED = 3;
  RUN_STATUS_INFRASTRUCTURE_FAILED = 4;
  RUN_STATUS_DEADLINE_EXCEEDED = 5;
  // v3 search exhaustion retains the actual completed-round count.
  RUN_STATUS_SEARCH_EXHAUSTED = 6;
}

// Cumulative reservation ceilings over all children of one run. Steps, tokens
// and exact USD are positive; integers fit signed int64, USD uses at most nine
// fractional digits and is below 1,000,000. Wall time has millisecond precision
// and is at most 30 days. These values are not actual supplier bills.
message RunBudget {
  uint64 maximum_steps = 1;
  uint64 maximum_input_tokens = 2;
  uint64 maximum_output_tokens = 3;
  loop.v1.Money maximum_cost = 4;
  google.protobuf.Duration maximum_wall_time = 5;
}

// Internal persistence identity resolved by loopd, not accepted or returned by
// any RPC. It binds the Human owner and independent Agent executor to the exact
// frozen Discovery input and protocol contract.
message RunSpecification {
  loop.v1.PolicyReference plan = 1;
  loop.v1.RunId run_id = 2;
  loop.v1.Actor owner = 3;
  loop.v1.Actor executor = 4;
  loop.discovery.v1.DiscoveryJobInput discovery = 5;
  loop.v1.ProtocolSelectionSnapshot protocol_selection = 6;
  RunBudget budget = 7;
  uint32 maximum_rounds = 8;
  // Presence opts into numerical workflows; absent preserves v1 bytes.
  NumericalWorkflow numerical = 9;
  // Present only for v3; resolved from the installed immutable plan.
  loop.v1.PolicyReference feedback_policy = 10;
}

// Immutable research delegation. This actor must have a separately registered
// Research Service identity; a Discovery Agent cannot acquire numerical permissions.
message NumericalWorkflow {
  loop.v1.Actor research_executor = 1;
  loop.v1.PolicyReference recipe = 2;
  loop.research.v1.ResearchJobBudget evaluation_budget = 3;
  loop.research.v1.ResearchJobBudget portfolio_budget = 4;
  loop.v1.ProtocolSelectionSnapshot protocol_selection = 5;
  // v3 only. Uses the safe research budget contract, never a generic job input.
  loop.research.v1.ResearchJobBudget perturbation_budget = 6;
}

enum RunStage {
  RUN_STAGE_UNSPECIFIED = 0;
  RUN_STAGE_DISCOVERY = 1;
  RUN_STAGE_EVALUATION = 2;
  RUN_STAGE_PORTFOLIO = 3;
  RUN_STAGE_PERTURBATION = 4;
}

enum RoundDisposition {
  // Zero explicitly means this round has no committed research disposition.
  ROUND_DISPOSITION_UNSPECIFIED = 0;
  // Registered portfolio evidence, never an assertion of formal admission.
  ROUND_DISPOSITION_EVALUATED = 1;
  ROUND_DISPOSITION_DUPLICATE = 2;
  ROUND_DISPOSITION_PREVIOUSLY_REJECTED = 3;
  ROUND_DISPOSITION_INSUFFICIENT_COVERAGE = 4;
  // A successful selector with no remaining candidate; never factor rejection.
  ROUND_DISPOSITION_EXHAUSTED = 5;
}

// Safe v2 projection, without inputs, data references, leases or candidate AST.
// The digest binds the immutable transition evidence; it is not an authority.
message ResearchRunView {
  uint32 round = 1;
  RunStage stage = 2;
  oneof current_child {
    loop.discovery.v1.DiscoveryJobHandle discovery = 3;
    loop.research.v1.ResearchJobHandle research = 4;
  }
  loop.v1.JobId discovery_job_id = 5;
  loop.v1.JobId evaluation_job_id = 6;
  loop.v1.FactorExpressionId expression_id = 7;
  loop.v1.FactorSpecId factor_spec_id = 8;
  loop.v1.Sha256Digest binding_sha256 = 9;
  RoundDisposition disposition = 10;
  // v3 only; exactly one of this and discovery_job_id names the real proposer.
  loop.v1.JobId perturbation_job_id = 11;
}

// Safe v3 projection. Digests identify frozen evidence but confer no authority.
// No raw feedback, work, random seed, model request or data reference is exposed.
message AdaptiveRunView {
  loop.v1.PolicyReference feedback_policy = 1;
  uint32 source_count = 2;
  loop.v1.Sha256Digest feedback_sha256 = 3;
  loop.v1.Sha256Digest model_context_sha256 = 4;
  // Both family and state are absent until a verified family is established.
  loop.v1.Sha256Digest family_sha256 = 5;
  uint64 random_draws = 6;
  loop.v1.Sha256Digest state_sha256 = 7;
}

// Safe persisted projection. Reservations charge each child's full frozen
// allowance once; completed or ambiguous calls do not release them. The current
// child handle contains no input, lease, model response, or candidate AST.
message RunView {
  loop.v1.RunId run_id = 1;
  RunStatus status = 2;
  uint64 revision = 3;
  uint32 maximum_rounds = 4;
  uint32 completed_rounds = 5;
  loop.discovery.v1.DiscoveryJobHandle current_job = 6;
  RunBudget budget = 7;
  uint64 reserved_steps = 8;
  uint64 reserved_input_tokens = 9;
  uint64 reserved_output_tokens = 10;
  loop.v1.Money reserved_cost = 11;
  google.protobuf.Timestamp submitted_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp deadline = 14;
  // False for stop-only observation when live plans have not been validated.
  bool plan_verified = 15;
  // v2/v3 only; mutually exclusive with the v1 current_job field.
  ResearchRunView research = 16;
  // v3 only; requires a research projection.
  AdaptiveRunView adaptive = 17;
}

message StartRunRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.PolicyReference plan = 2;
  // 0 preserves v1; 2 selects numerical, 3 selects adaptive numerical semantics.
  uint32 workflow_version = 3;
}

message StartRunResponse {
  RunView run = 1;
}

message StepRunRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.RunId run_id = 2;
  uint64 expected_revision = 3;
  uint32 workflow_version = 4;
}

message StepRunResponse {
  RunView run = 1;
}

message GetRunRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.RunId run_id = 2;
  uint32 workflow_version = 3;
}

message GetRunResponse {
  RunView run = 1;
}
