syntax = "proto3";

package loop.research.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "loop/v1/common.proto";
import "loop/v1/development_data.proto";
import "loop/v1/factor.proto";
import "loop/v1/research_common.proto";

// ResearchService accepts development inputs only. Implementations must
// validate each command and atomically insert a queued job; computation never
// runs inline. Durable insertion is implemented by loopd in Phase 3.
service ResearchService {
  rpc EnqueueFactorEvaluation(EnqueueFactorEvaluationRequest) returns (EnqueueFactorEvaluationResponse);
  rpc EnqueueBacktest(EnqueueBacktestRequest) returns (EnqueueBacktestResponse);
  rpc EnqueueReconciliation(EnqueueReconciliationRequest) returns (EnqueueReconciliationResponse);
}

// ResearchJobStatus is a non-sensitive projection of durable orchestration
// state. It cannot carry a job specification, input, lease, or outcome body.
enum ResearchJobStatus {
  RESEARCH_JOB_STATUS_UNSPECIFIED = 0;
  RESEARCH_JOB_STATUS_QUEUED = 1;
  RESEARCH_JOB_STATUS_LEASED = 2;
  RESEARCH_JOB_STATUS_RUNNING = 3;
  RESEARCH_JOB_STATUS_SUCCEEDED = 4;
  RESEARCH_JOB_STATUS_FACTOR_REJECTED = 5;
  RESEARCH_JOB_STATUS_INFRASTRUCTURE_FAILED = 6;
  RESEARCH_JOB_STATUS_CANCELLED = 7;
  RESEARCH_JOB_STATUS_BUDGET_EXHAUSTED = 8;
}

// ResearchJobBudget is bounded and enforced by loopd. loopd maps this external
// value into an internal durable JobBudget only after request validation.
message ResearchJobBudget {
  uint32 maximum_steps = 1;
  uint64 maximum_input_tokens = 2;
  uint64 maximum_output_tokens = 3;
  loop.v1.Money maximum_cost = 4;
  google.protobuf.Duration maximum_wall_time = 5;
}

// These three inputs expose only narrow development-reference shapes. loopd
// must resolve every opaque dataset ID against its server-owned snapshot
// registry before persistence or execution; wire validation alone cannot prove
// sample role. The messages are deliberately owned by the research role instead
// of importing the generic durable JobSpecification union, which also contains
// internal holdout work.
message FactorEvaluationInput {
  loop.v1.FactorSpec factor = 1;
  loop.v1.DevelopmentDatasetReference dataset = 2;
  ResearchJobBudget budget = 3;
}

message BacktestInput {
  ResearchJobBudget budget = 1;
  loop.v1.FactorSpecId factor_spec_id = 2;
  loop.v1.DevelopmentDatasetReference dataset = 3;
  loop.v1.ReturnDefinition return_definition = 4;
  loop.v1.ResearchProvenanceFingerprint provenance = 5;
  loop.v1.Sha256Digest deterministic_seed = 6;
}

message ReconciliationInput {
  loop.v1.BacktestId primary_backtest_id = 1;
  loop.v1.BacktestId independent_backtest_id = 2;
  loop.v1.PolicyReference reconciliation_policy = 3;
  ResearchJobBudget budget = 4;
}

message EnqueueFactorEvaluationRequest {
  loop.v1.CommandContext context = 1;
  FactorEvaluationInput input = 2;
}

message EnqueueFactorEvaluationResponse {
  ResearchJobHandle job = 1;
}

message EnqueueBacktestRequest {
  loop.v1.CommandContext context = 1;
  BacktestInput input = 2;
}

message EnqueueBacktestResponse {
  ResearchJobHandle job = 1;
}

message EnqueueReconciliationRequest {
  loop.v1.CommandContext context = 1;
  ReconciliationInput input = 2;
}

message EnqueueReconciliationResponse {
  ResearchJobHandle job = 1;
}

// ResearchJobHandle deliberately omits the persisted JobSpecification,
// inputs, leases, output artifacts, and outcome details.
message ResearchJobHandle {
  loop.v1.JobId job_id = 1;
  ResearchJobStatus status = 2;
  uint64 revision = 3;
  google.protobuf.Timestamp submitted_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
