syntax = "proto3";

package loop.jobs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "loop/v1/artifact.proto";
import "loop/v1/backtest.proto";
import "loop/v1/common.proto";
import "loop/v1/job.proto";

service JobService {
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc AcquireJobLease(AcquireJobLeaseRequest) returns (AcquireJobLeaseResponse);
  rpc HeartbeatJobLease(HeartbeatJobLeaseRequest) returns (HeartbeatJobLeaseResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // Materializes a read-only, job-scoped view; payload bytes never cross RPC.
  // Protected access additionally requires a lease-bound capability in metadata.
  rpc PrepareJobArtifacts(PrepareJobArtifactsRequest) returns (PrepareJobArtifactsResponse);
  // Execute a deployment-selected numerical worker on an existing development
  // lease. The caller cannot submit output bytes, code, paths or worker identity.
  // Same command replay verifies immutable output instead of recomputing it.
  rpc EvaluateFactor(EvaluateFactorRequest) returns (EvaluateFactorResponse);
  // Execute only the pinned installed portfolio producer on a development
  // lease. Metrics, trial subsets, worker paths and holdouts are not accepted.
  rpc ExecuteBacktest(ExecuteBacktestRequest) returns (ExecuteBacktestResponse);
  // Reconstruct a registered development primary and run both pinned independent
  // validators under this reconciliation job's lease. No caller result import.
  rpc ExecuteReconciliation(ExecuteReconciliationRequest) returns (ExecuteReconciliationResponse);
  // Revalidate primary and independent evidence before returning its report.
  rpc ReadReconciliation(ReadReconciliationRequest) returns (ReadReconciliationResponse);
  // Reconstruct current evidence; historical job metadata is not a freshness claim.
  rpc ReadBacktest(ReadBacktestRequest) returns (ReadBacktestResponse);
  // Audit metadata release before responding; artifact access remains separate.
  rpc ExportBacktest(ExportBacktestRequest) returns (ExportBacktestResponse);
  // Ordinary admission/readmission share the same durable command. Missing
  // independent validation remains a dependency failure, never an approval.
  rpc DecideFactor(DecideFactorRequest) returns (DecideFactorResponse);
}

message GetJobRequest {
  loop.v1.JobId job_id = 1;
}

message GetJobResponse {
  loop.v1.JobRecord job = 1;
}

message AcquireJobLeaseRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  uint64 expected_revision = 3;
  google.protobuf.Duration requested_duration = 4;
}

message AcquireJobLeaseResponse {
  loop.v1.JobRecord job = 1;
}

message HeartbeatJobLeaseRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
  google.protobuf.Duration requested_extension = 5;
}

message HeartbeatJobLeaseResponse {
  loop.v1.JobRecord job = 1;
}

message CompleteJobRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
  loop.v1.JobOutcome outcome = 5;
}

message CompleteJobResponse {
  loop.v1.JobRecord job = 1;
}

message CancelJobRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  uint64 expected_revision = 3;
  string reason = 4;
}

message CancelJobResponse {
  loop.v1.JobRecord job = 1;
}

message PrepareJobArtifactsRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
}

// An immutable acceptance record, not bearer authority. Replays recheck the
// live lease and data bytes. A later lease loss invalidates access, not history.
message PrepareJobArtifactsResponse {
  loop.v1.JobId job_id = 1;
  loop.v1.LeaseId lease_id = 2;
  loop.v1.Sha256Digest data_manifest_sha256 = 3;
  repeated loop.v1.ArtifactRef artifacts = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Opaque read-only view namespace. It is not a path or reusable capability.
  string view_id = 6;
}

message EvaluateFactorRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
}

message EvaluateFactorResponse {
  loop.v1.JobRecord job = 1;
}

message ExecuteBacktestRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
}

message ExecuteBacktestResponse {
  loop.v1.JobRecord job = 1;
}

message ExecuteReconciliationRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  loop.v1.LeaseId lease_id = 3;
  uint64 expected_revision = 4;
}

message ExecuteReconciliationResponse {
  loop.v1.JobRecord job = 1;
}

message ReadReconciliationRequest {
  loop.v1.JobId job_id = 1;
}

message ReadReconciliationResponse {
  loop.v1.JobRecord job = 1;
  // Small immutable manifest, never datasets or full numerical ledgers in RPC.
  loop.v1.ArtifactRef report = 2;
}

message ReadBacktestRequest {
  loop.v1.JobId job_id = 1;
  string context_id = 2;
}

message ReadBacktestResponse {
  loop.v1.BacktestResult result = 1;
}

message ExportBacktestRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId job_id = 2;
  string context_id = 3;
  google.protobuf.Timestamp deadline = 4;
}

message ExportBacktestResponse {
  loop.v1.BacktestResult result = 1;
  google.protobuf.Timestamp accepted_at = 2;
  bool replayed = 3;
}

message DecideFactorRequest {
  loop.v1.CommandContext context = 1;
  loop.v1.JobId source_job_id = 2;
  string context_id = 3;
  uint64 expected_revision = 4;
  string reason = 5;
  string override_reason = 6;
  string override_approval_id = 7;
  google.protobuf.Timestamp deadline = 8;
}

message FactorDecisionState {
  loop.v1.FactorSpecId factor_spec_id = 1;
  uint64 revision = 2;
  string status = 3;
  uint64 admissions = 4;
  uint64 retirements = 5;
  loop.v1.JobId source_job_id = 6;
}

message DecideFactorResponse {
  repeated FactorDecisionState states = 1;
  string rejection_code = 2;
  bool override_applied = 3;
  google.protobuf.Timestamp accepted_at = 4;
  bool replayed = 5;
}
