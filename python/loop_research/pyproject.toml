[project]
name = "loop-research"
version = "0.2.0a1"
description = "US-equities research worker for Loop Engine"
authors = [{ name = "hojiahao", email = "hojiahao@outlook.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
loop-research = "loop_research.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["loop_research"]
mypy_path = "src"
