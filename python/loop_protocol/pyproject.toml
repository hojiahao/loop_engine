[project]
name = "loop-engine-protocol"
version = "0.2.0a1"
description = "Generated wire contracts and canonical identities for Loop Engine"
authors = [{ name = "hojiahao", email = "hojiahao@outlook.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "grpcio==1.83.1",
    "protobuf==7.36.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools==1.83.1",
    "hatchling==1.32.0",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loop", "src/loop_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/loop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["loop_protocol"]
mypy_path = "src"
