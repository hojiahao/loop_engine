name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHON_VERSION: "3.14.4"
  UV_VERSION: "0.11.29"
  LOOP_ENGINE_RUST_DIST_MIRROR: official

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.tools/uv-cache
      - name: Install the real research worker for Rust integration tests
        run: bash scripts/uv.sh sync --python "${PYTHON_VERSION}" --all-packages --all-groups --locked
      - run: bash scripts/postgres-test.sh start
      - run: cargo test --workspace --all-features --locked --offline -- --test-threads=2
      - name: Report disposable PostgreSQL capacity
        if: always()
        run: bash scripts/postgres-test.sh usage
      - name: Remove disposable PostgreSQL fixture
        if: always()
        run: bash scripts/postgres-test.sh stop

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  python-research:
    name: Python research worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/loop_research
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.tools/uv-cache
      - run: ../../scripts/uv.sh sync --python "${PYTHON_VERSION}" --all-packages --all-groups --locked
      - run: ../../scripts/verify-python-environment.sh
      - run: ../../scripts/uv-research.sh run --locked --offline --no-sync ruff check src tests
      - run: ../../scripts/uv-research.sh run --locked --offline --no-sync ruff format --check src tests
      - run: ../../scripts/uv-research.sh run --locked --offline --no-sync mypy
      - name: Test declared research dependencies in isolation
        run: ../../scripts/uv-research.sh run --isolated --locked pytest
      - run: ../../scripts/uv-research.sh run --locked --offline --no-sync hatchling build

  python-protocol:
    name: Python protocol contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/loop_protocol
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.tools/uv-cache
      - run: ../../scripts/uv.sh sync --python "${PYTHON_VERSION}" --all-packages --all-groups --locked
      - run: ../../scripts/verify-python-environment.sh
      - run: ../../scripts/uv-protocol.sh run --locked --offline --no-sync ruff check src tests
      - run: ../../scripts/uv-protocol.sh run --locked --offline --no-sync ruff format --check src tests
      - run: ../../scripts/uv-protocol.sh run --locked --offline --no-sync mypy
      - name: Test declared protocol dependencies in isolation
        run: ../../scripts/uv-protocol.sh run --isolated --locked pytest
      - run: ../../scripts/uv-protocol.sh run --locked --offline --no-sync hatchling build

  python-legacy:
    name: Legacy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.tools/uv-cache
      - run: ./scripts/uv.sh sync --python "${PYTHON_VERSION}" --all-packages --all-groups --locked
      - run: ./scripts/verify-python-environment.sh
      - name: Test declared legacy dependencies in isolation
        run: ./scripts/uv.sh run --isolated --locked pytest

  workspace-gates:
    name: Unified workspace gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.tools/uv-cache
      - name: Expose user-local tools
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bootstrap from locks
        run: ./scripts/bootstrap.sh
      - run: just check
      - run: just test
      - run: just build
      - run: just doctor

  development-container:
    name: DaoCloud development container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and verify clean container
        run: ./scripts/container-gate.sh
