[project]
name = "loop-engine-workspace"
version = "0.2.0a1"
description = "Loop Engine workspace with the frozen legacy regression suite"
maintainers = [
    { name = "hojiahao", email = "hojiahao@outlook.com" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0.2",
    "requests>=2.28",
]

[tool.uv]
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.workspace]
members = [
    "python/loop_protocol",
    "python/loop_research",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-q"
