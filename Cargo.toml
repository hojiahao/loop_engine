[workspace]
members = [
    "crates/loop-core",
    "crates/loop-protocol",
    "crates/loopd",
    "crates/loopctl",
    "crates/loop-tui",
    "tools/loop-protocol-codegen",
]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["hojiahao <hojiahao@outlook.com>"]
repository = "https://github.com/hojiahao/loop_engine"
publish = false

[workspace.dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
clap = { version = "4.5.47", features = ["derive", "env"] }
prost = "0.14.4"
prost-types = "0.14.4"
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
